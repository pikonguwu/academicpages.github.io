---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <script type="importmap">
      {"imports":{"three":"{{ '/assets/js/three/three.module.min.js' | relative_url }}","three/addons/":"{{ '/assets/js/three/addons/' | relative_url }}"}}
    </script>
  </head>
  <body class="archive-home">
    <a class="archive-skip" href="#archive-index">Skip to archive files</a>
    <div class="archive-boot" role="dialog" aria-modal="true" aria-labelledby="boot-title" hidden>
      <div class="boot-corner">Z.Z. / PERSONAL DATABASE</div>
      <div class="boot-center">
        <div class="boot-orbit" aria-hidden="true"><i></i><i></i><i></i><span>+</span></div>
        <p>PHYSICAL INTELLIGENCE</p>
        <h1 id="boot-title">ZHIMU ZHOU</h1>
        <div class="boot-subtitle">RESEARCH <strong>ARCHIVE</strong></div>
        <div class="boot-line" aria-hidden="true"></div>
        <p class="boot-status" role="status">PREPARING ARCHIVE</p>
        <button class="boot-enter" type="button">ENTER ARCHIVE <span aria-hidden="true">↗</span></button>
      </div>
      <button class="boot-skip" type="button">SKIP INTRO <kbd>ESC</kbd></button>
    </div>
    <main class="home archive-app" id="main-content">
      {{ content }}
    </main>
    <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
  </body>
</html>
